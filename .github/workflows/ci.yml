name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet pytest ruff

      - name: Lint (ruff, F-only)
        run: ruff check skills/flora-batch/scripts

      - name: Test
        run: python3 -m pytest skills/flora-batch/scripts/tests -q
